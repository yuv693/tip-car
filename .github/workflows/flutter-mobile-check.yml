name: Flutter mobile checks

on:
  pull_request:
    branches: [tipcarbus-starter]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - '.github/workflows/flutter-mobile-check.yml'
      - 'docs/android-build-setup.md'
  push:
    branches: [tipcarbus-starter]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - '.github/workflows/flutter-mobile-check.yml'
      - 'docs/android-build-setup.md'
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify production Supabase configuration
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing GitHub Actions secret: SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing GitHub Actions secret: SUPABASE_ANON_KEY" && exit 1)
      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: flutter create --platforms=android --project-name tip_car .
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Run tests
        working-directory: mobile
        run: flutter test
      - name: Build debug APK
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Package Android project
        run: |
          zip -r tip-car-android-project.zip mobile \
            -x 'mobile/.dart_tool/*' \
               'mobile/build/*' \
               'mobile/android/local.properties' \
               'mobile/android/.gradle/*' \
               'mobile/android/app/build/*'
      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: tip-car-android-project
          path: tip-car-android-project.zip
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tip-car-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
