name: Flutter mobile checks

on:
  pull_request:
    branches: [tipcarbus-starter]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - '.github/workflows/flutter-mobile-check.yml'
      - 'docs/android-build-setup.md'
  push:
    branches: [tipcarbus-starter]
    paths:
      - 'mobile/**'
      - 'supabase/**'
      - '.github/workflows/flutter-mobile-check.yml'
      - 'docs/android-build-setup.md'
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/tip-car-AndroidManifest.xml
          flutter create --platforms=android --project-name tip_car .
          cp /tmp/tip-car-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Enable Google Services plugin when Firebase config is supplied
        run: |
          if [ -f mobile/android/app/google-services.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          root = Path("mobile/android")
          settings = next((p for p in [root / "settings.gradle.kts", root / "settings.gradle"] if p.exists()), None)
          app = next((p for p in [root / "app" / "build.gradle.kts", root / "app" / "build.gradle"] if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("Could not locate generated Android Gradle files")
          s = settings.read_text()
          if "com.google.gms.google-services" not in s:
              line = '    id("com.google.gms.google-services") version "4.4.4" apply false\n' if settings.suffix == ".kts" else '    id "com.google.gms.google-services" version "4.4.4" apply false\n'
              s = s.replace("plugins {\n", "plugins {\n" + line, 1)
              settings.write_text(s)
          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              line = '    id("com.google.gms.google-services")\n' if app.suffix == ".kts" else '    id "com.google.gms.google-services"\n'
              a = a.replace("plugins {\n", "plugins {\n" + line, 1)
              app.write_text(a)
          PY
          else
            echo "Firebase Android config not present; building with Realtime inbox fallback."
          fi
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: mobile
        run: flutter test
      - name: Build debug APK connected to TipCarBus
        working-directory: mobile
        run: |
          flutter build apk --debug --split-per-abi \
            --dart-define=SUPABASE_URL=https://wrjddfpxhqhpvhdgpres.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_vn72HbTxOfVmyJD2sRNQzg_UkNpdwsX
      - name: Package Android project
        run: |
          zip -r tip-car-android-project.zip mobile \
            -x 'mobile/.dart_tool/*' \
               'mobile/build/*' \
               'mobile/android/local.properties' \
               'mobile/android/.gradle/*' \
               'mobile/android/app/build/*'
      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: tip-car-android-project
          path: tip-car-android-project.zip
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tip-car-debug-apks
          path: mobile/build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
